name: Banana Native Android

on:
  workflow_dispatch:
    inputs:
      games:
        description: Comma-separated title IDs from dm/games
        default: '040074A01BF12000,0400C3F00006E000'
        type: string

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      NX_GAMES: ${{ inputs.games }}
      NDK_VERSION: 28.2.13676358
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: '10.0.x'
      - name: Android tools
        run: |
          set -euo pipefail
          sdk="${ANDROID_HOME:?Android SDK not found}"
          sdkmanager="$sdk/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$sdkmanager" ]; then sdkmanager="$(command -v sdkmanager)"; fi
          "$sdkmanager" "platforms;android-36" "ndk;$NDK_VERSION" "cmake;3.22.1"
          echo "ANDROID_NDK_HOME=$sdk/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
          echo "JAVA_HOME=${JAVA_HOME_17_X64:?JDK 17 not found}" >> "$GITHUB_ENV"
          printf 'sdk.dir=%s\n' "$sdk" > android/app/local.properties
          sudo apt-get update && sudo apt-get install -y zsh ninja-build libdigest-sha-perl
      - name: Restore fixed Android signing key
        env:
          BANANA_DEBUG_KEYSTORE_B64: ${{ secrets.BANANA_DEBUG_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          test -n "$BANANA_DEBUG_KEYSTORE_B64"
          umask 077
          mkdir -p "$HOME/.android"
          printf '%s' "$BANANA_DEBUG_KEYSTORE_B64" | base64 --decode > "$HOME/.android/debug.keystore"
      - name: Native preparation engine and APK
        env:
          NX_SIGN_STORE_B64: ${{ secrets.NX_SIGN_STORE_B64 }}
          NX_SIGN_ALIAS: ${{ secrets.NX_SIGN_ALIAS }}
          NX_SIGN_PASS: ${{ secrets.NX_SIGN_PASS }}
          NX_SIGN_SHA256: ${{ vars.NX_SIGN_SHA256 }}
        run: |
          set -euo pipefail
          : "${NX_SIGN_STORE_B64:?Set the NX_SIGN_STORE_B64 repository secret}"
          : "${NX_SIGN_ALIAS:?Set the NX_SIGN_ALIAS repository secret}"
          : "${NX_SIGN_PASS:?Set the NX_SIGN_PASS repository secret}"
          : "${NX_SIGN_SHA256:?Set NX_SIGN_SHA256 to the APK certificate fingerprint}"
          umask 077
          export NX_SIGN_STORE="$RUNNER_TEMP/banana-signing.p12"
          trap 'rm -f "$NX_SIGN_STORE"' EXIT
          python3 -c 'import base64, os, pathlib; pathlib.Path(os.environ["NX_SIGN_STORE"]).write_bytes(base64.b64decode(os.environ["NX_SIGN_STORE_B64"], validate=True))'
          unset NX_SIGN_STORE_B64
          stage="$RUNNER_TEMP/banana-pack"
          android/ondevice/build.sh "$stage"
          cd android/app
          ./gradlew --no-daemon "-PnxPackStage=$stage/stage" "-PnxGames=$NX_GAMES" apk
      - name: Verify APK certificate
        env:
          NX_SIGN_SHA256: ${{ vars.NX_SIGN_SHA256 }}
        run: |
          set -euo pipefail
          apksigner="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort | tail -n 1)"
          test -n "$apksigner"
          "$apksigner" verify --print-certs-pem android/app/out/nxnative-android.apk > "$RUNNER_TEMP/banana-cert.txt"
          actual="$(python3 -c 'import hashlib, re, ssl, sys; pem = re.findall(r"-----BEGIN CERTIFICATE-----.*?-----END CERTIFICATE-----", sys.stdin.read(), re.S); print("\n".join(sorted({hashlib.sha256(ssl.PEM_cert_to_DER_cert(cert)).hexdigest() for cert in pem})))' < "$RUNNER_TEMP/banana-cert.txt")"
          expected="$(printf '%s' "$NX_SIGN_SHA256" | tr -d '[:space:]:' | tr '[:upper:]' '[:lower:]')"
          echo "APK SHA-256: ${actual:-no detectado} | SHA-256 esperado: ${expected:-vacio}"
          if [[ ! "$expected" =~ ^[0-9a-f]{64}$ || "$actual" != "$expected" ]]; then
            echo "::error::APK signing certificate differs from NX_SIGN_SHA256"
            exit 1
          fi
          echo "APK certificate SHA-256: $actual"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: banana-native-android
          path: android/app/out/*.apk
          if-no-files-found: error
